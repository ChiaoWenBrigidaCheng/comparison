<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>相似系所比較分析網站</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #667085;
      --line: #e1e7f0;
      --line-strong: #cad6e3;
      --panel: #ffffff;
      --surface-soft: #fbfcff;
      --paper: #f5f7fb;
      --navy: #1c3f60;
      --teal: #0f766e;
      --green: #4d7c0f;
      --amber: #b7791f;
      --rose: #b42318;
      --blue-soft: #eef5fb;
      --teal-soft: #e8f7f4;
      --amber-soft: #fff7e7;
      --green-soft: #f0f8e8;
      --radius: 8px;
      --radius-pill: 999px;
      --shadow: 0 14px 32px rgba(31, 41, 55, 0.06), 0 2px 8px rgba(31, 41, 55, 0.04);
      --shadow-subtle: 0 8px 22px rgba(31, 41, 55, 0.05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "微軟正黑體", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, table, input { font: inherit; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 20px;
      background: rgba(255, 255, 255, 0.92);
      border-right: 1px solid var(--line);
      box-shadow: 8px 0 28px rgba(31, 41, 55, 0.035);
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
    }

    .brand h1 {
      margin: 0;
      color: var(--navy);
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
      font-weight: 700;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-buttons {
      display: grid;
      gap: 10px;
    }

    .nav-button {
      width: 100%;
      border: 1px solid transparent;
      background: var(--surface-soft);
      color: var(--ink);
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      border-radius: var(--radius-pill);
      box-shadow: inset 0 0 0 1px var(--line);
      font-weight: 600;
      transition: border-color .15s ease, background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
    }

    .nav-button:hover {
      border-color: #9ccfca;
      background: #f2fbf9;
      box-shadow: inset 0 0 0 1px #9ccfca, var(--shadow-subtle);
      transform: translateY(-1px);
    }

    .nav-button.active {
      border-color: #9db8d2;
      background: linear-gradient(180deg, #f4f9ff, #eaf5f8);
      color: var(--navy);
      font-weight: 700;
      box-shadow: inset 0 0 0 1px #9db8d2, var(--shadow-subtle);
    }

    .source-box {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
      overflow: hidden;
    }

    .source-box strong {
      display: block;
      color: var(--ink);
      margin-bottom: 8px;
      font-size: 13px;
    }

    .main {
      min-width: 0;
      padding: 30px 34px 50px;
    }

    .page-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: start;
      margin-bottom: 22px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15;
      color: var(--navy);
      letter-spacing: 0;
      font-weight: 700;
    }

    .page-header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .feasibility {
      min-width: 140px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .feasibility span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .feasibility strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      color: var(--teal);
    }

    .feasibility.caution strong { color: var(--amber); }

    .notice {
      margin-bottom: 18px;
      padding: 14px 16px;
      background: var(--teal-soft);
      border: 1px solid #c4ebe5;
      border-radius: var(--radius);
      color: #155c56;
      box-shadow: var(--shadow-subtle);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .kpi {
      position: relative;
      min-height: 112px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .kpi.has-tip {
      cursor: help;
      outline: none;
    }

    .kpi.has-tip .label,
    .kpi.has-tip .note {
      display: inline-flex;
      border-bottom: 1px dotted #6b7280;
    }

    .kpi.has-tip::after {
      content: attr(data-tip);
      position: absolute;
      z-index: 30;
      left: 12px;
      top: calc(100% + 10px);
      width: min(420px, 76vw);
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 14px 34px rgba(31, 41, 55, 0.18);
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-line;
      text-align: left;
      transform: translateY(-4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    .kpi.has-tip::before {
      content: "";
      position: absolute;
      z-index: 31;
      left: 28px;
      top: calc(100% + 2px);
      border: 6px solid transparent;
      border-bottom-color: #1f2937;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }

    .kpi.has-tip:hover::after,
    .kpi.has-tip:focus-visible::after,
    .kpi.has-tip:hover::before,
    .kpi.has-tip:focus-visible::before {
      opacity: 1;
    }

    .kpi.has-tip:hover::after,
    .kpi.has-tip:focus-visible::after {
      transform: translateY(0);
    }

    .kpi .label {
      color: var(--muted);
      font-size: 13px;
    }

    .kpi .value {
      margin-top: 8px;
      color: var(--navy);
      font-weight: 800;
      font-size: 26px;
      line-height: 1.2;
    }

    .kpi .note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .tooltip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px dotted #6b7280;
      cursor: help;
      outline: none;
    }

    .floating-tooltip {
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      max-width: min(380px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: var(--radius);
      background: #1f2937;
      color: #ffffff;
      box-shadow: 0 14px 34px rgba(31, 41, 55, 0.18);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-line;
      text-align: left;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }

    .floating-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section {
      margin-top: 22px;
      padding: 22px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
    }

    .section h3 {
      margin: 0;
      color: var(--navy);
      font-size: 22px;
      letter-spacing: 0;
      font-weight: 700;
    }

    .section-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .section-source {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .section-source strong {
      color: var(--navy);
    }

    .data-explorer {
      display: grid;
      gap: 14px;
    }

    .explorer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
    }

    .control-field {
      display: grid;
      gap: 6px;
      min-width: min(260px, 100%);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .control-field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      padding: 10px 12px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      box-shadow: var(--shadow-subtle);
    }

    .dept-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .dept-check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      background: var(--surface-soft);
      color: var(--ink);
      font-size: 13px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
    }

    .dept-check input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--teal);
    }

    .explorer-output {
      min-height: 112px;
    }

    .empty-state {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: var(--surface-soft);
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .analysis-item {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      box-shadow: var(--shadow-subtle);
    }

    .analysis-item strong {
      display: block;
      margin-bottom: 8px;
      color: var(--teal);
      font-size: 15px;
    }

    .analysis-item p {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
    }

    .analysis-evidence {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .analysis-evidence b {
      color: var(--navy);
    }

    .chart-wrap {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      padding: 8px;
    }

    .chart-note {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      padding: 6px 10px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .chart-note strong {
      color: var(--navy);
    }

    .unit-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 10px;
      padding: 3px 9px;
      border: 1px solid #b7d9e8;
      border-radius: var(--radius-pill);
      background: #eaf7fb;
      color: #0f5f78;
      font-size: 12px;
      font-weight: 700;
      vertical-align: middle;
    }

    .formula-details {
      margin: 8px 10px 0;
      border: 1px solid #d8e3f3;
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      font-size: 13px;
    }

    .formula-details summary {
      cursor: pointer;
      padding: 8px 10px;
      color: var(--navy);
      font-weight: 700;
    }

    .formula-details p {
      margin: 0;
      padding: 0 10px 10px;
      color: var(--muted);
      line-height: 1.7;
    }

    svg.line-chart {
      width: 100%;
      min-height: 320px;
      display: block;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow-subtle);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: #ffffff;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #f3f8fc;
      color: var(--navy);
      font-weight: 700;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) td {
      background: #fbfdff;
    }

    tr:last-child td { border-bottom: 0; }

    .status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--green-soft);
      color: var(--green);
      white-space: nowrap;
    }

    .status.warn {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .curriculum-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .source-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .dept-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      padding: 16px;
      box-shadow: var(--shadow-subtle);
    }

    .dept-card h4 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: 18px;
    }

    .dept-card dl {
      margin: 0;
      display: grid;
      gap: 8px;
    }

    .dept-card dt {
      color: var(--teal);
      font-weight: 700;
      font-size: 13px;
    }

    .dept-card dd {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
    }

    .source-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      padding: 16px;
      box-shadow: var(--shadow-subtle);
    }

    .source-card h4 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 18px;
    }

    .source-summary {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .source-facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .source-fact {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 10px;
    }

    .source-fact span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .source-fact strong {
      display: block;
      color: var(--navy);
      font-size: 18px;
      margin-top: 3px;
    }

    .dist-list {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .mini-list {
      display: grid;
      gap: 4px;
    }

    .mini-list div {
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .dist-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      color: var(--ink);
      font-size: 13px;
    }

    .dist-row span:first-child {
      overflow-wrap: anywhere;
    }

    .source-block-title {
      margin-top: 12px;
      color: var(--teal);
      font-weight: 700;
      font-size: 13px;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .list-panel {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      box-shadow: var(--shadow-subtle);
    }

    .list-panel h4 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: 17px;
    }

    .list-panel ul {
      margin: 0;
      padding-left: 20px;
    }

    .list-panel li {
      margin: 8px 0;
    }

    .research-note {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .note-box {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--teal-soft);
      padding: 14px;
      color: #155c56;
      font-size: 14px;
      box-shadow: var(--shadow-subtle);
    }

    .note-box.alt {
      background: var(--amber-soft);
      color: #7a4f05;
    }

    .mobile-tabs {
      display: none;
      padding: 12px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 8px 22px rgba(31, 41, 55, 0.05);
    }

    .mobile-tabs select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-pill);
      padding: 12px;
      color: var(--ink);
      background: #ffffff;
      box-shadow: var(--shadow-subtle);
    }

    @media (max-width: 1180px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .analysis-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 900px) {
      .app-shell { display: block; }
      .sidebar { display: none; }
      .mobile-tabs { display: block; }
      .main { padding: 22px 16px 36px; }
      .page-header { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .curriculum-grid, .source-grid, .split, .research-note { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .kpis, .analysis-grid { grid-template-columns: 1fr; }
      .section { padding: 16px; }
      .page-header h2 { font-size: 26px; }
      svg.line-chart { min-height: 260px; }
    }
  </style>
</head>
<body>
  <div class="mobile-tabs">
    <label for="groupSelect" hidden>選擇比較組</label>
    <select id="groupSelect"></select>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>相似系所比較</h1>
        <p>三組系所異同與整合可行性分析</p>
      </div>
      <nav class="nav-buttons" id="navButtons" aria-label="比較組切換"></nav>
      <div class="source-box">
        <strong>資料日期</strong>
        <div id="generatedAt"></div>
      </div>
    </aside>
    <main class="main" id="app"></main>
  </div>

      return `<span class="tooltip" tabindex="0" data-tip="${safeText}" aria-label="${safeText}">${escapeHtml(label)}</span>`;
    }

    function researchIndicator(label) {
      return tooltip(label, RESEARCH_INDICATOR_TIPS[label] || label);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    let activeTooltipTarget = null;
    let pinnedTooltipTarget = null;

    function tooltipTargetFromEvent(event) {
      const target = event.target;
      if (target instanceof Element) return target.closest(".tooltip");
      if (target?.parentElement) return target.parentElement.closest(".tooltip");
      return null;
    }

    function positionFloatingTooltip(target) {
      const tip = document.getElementById("floatingTooltip");
      if (!tip || !target || !tip.classList.contains("visible")) return;
      const margin = 12;
      const gap = 10;
      const rect = target.getBoundingClientRect();
      const tipRect = tip.getBoundingClientRect();
      const belowTop = rect.bottom + gap;
      const aboveTop = rect.top - tipRect.height - gap;
      const showAbove = aboveTop >= margin && belowTop + tipRect.height > window.innerHeight - margin;
      const top = showAbove ? aboveTop : Math.min(belowTop, window.innerHeight - tipRect.height - margin);
      const left = clamp(
        rect.left + rect.width / 2 - tipRect.width / 2,
        margin,
        window.innerWidth - tipRect.width - margin
      );
      tip.style.left = `${left}px`;
      tip.style.top = `${Math.max(margin, top)}px`;
    }

    function showFloatingTooltip(target) {
      const tip = document.getElementById("floatingTooltip");
      const text = target?.getAttribute("data-tip");
      if (!tip || !text) return;
      activeTooltipTarget = target;
      tip.textContent = text;
      target.setAttribute("aria-describedby", "floatingTooltip");
      tip.classList.add("visible");
      requestAnimationFrame(() => positionFloatingTooltip(target));
    }

    function hideFloatingTooltip(force = false) {
      if (pinnedTooltipTarget && !force) return;
      const tip = document.getElementById("floatingTooltip");
      if (!tip) return;
      if (activeTooltipTarget) activeTooltipTarget.removeAttribute("aria-describedby");
      activeTooltipTarget = null;
      pinnedTooltipTarget = null;
      tip.classList.remove("visible");
    }

    function initFloatingTooltips() {
      document.addEventListener("pointerover", event => {
        const target = tooltipTargetFromEvent(event);
        if (target) showFloatingTooltip(target);
      });
      document.addEventListener("pointerout", event => {
        const target = tooltipTargetFromEvent(event);
        const related = event.relatedTarget;
        if (target && !(related instanceof Node && target.contains(related))) hideFloatingTooltip();
      });
      document.addEventListener("focusin", event => {
        const target = tooltipTargetFromEvent(event);
        if (target) showFloatingTooltip(target);
      });
      document.addEventListener("focusout", event => {
        const target = tooltipTargetFromEvent(event);
        if (target) hideFloatingTooltip();
      });
      document.addEventListener("click", event => {
        const target = tooltipTargetFromEvent(event);
        if (target) {
          event.preventDefault();
          event.stopPropagation();
          pinnedTooltipTarget = pinnedTooltipTarget === target ? null : target;
          if (pinnedTooltipTarget) {
            showFloatingTooltip(target);
          } else {
            hideFloatingTooltip(true);
          }
          return;
        }
        hideFloatingTooltip(true);
      });
      window.addEventListener("scroll", () => {
        if (activeTooltipTarget) positionFloatingTooltip(activeTooltipTarget);
      }, true);
      window.addEventListener("resize", () => {
        if (activeTooltipTarget) positionFloatingTooltip(activeTooltipTarget);
      });
    }

    function integerAxis(maxValue, tickTarget = 5) {
      const max = Math.max(Math.ceil(maxValue), 1);
      const roughStep = max / Math.max(tickTarget - 1, 1);
      const power = Math.pow(10, Math.floor(Math.log10(roughStep)));
      const stepBase = [1, 2, 5, 10].find(base => base * power >= roughStep) || 10;
      const step = Math.max(1, Math.ceil(stepBase * power));
      const axisMax = Math.max(step, Math.ceil(max / step) * step);
      const ticks = [];
      for (let value = 0; value <= axisMax + step / 2; value += step) {
        ticks.push(value);
      }
      return { max: axisMax, ticks };
    }

    function lineChart(group) {
      const width = 900;
      const height = 320;
      const pad = { left: 54, right: 20, top: 28, bottom: 42 };
      const rows = group.enrollmentRows;
      const allValues = rows.flatMap(row => row.values);
      const max = Math.max(...allValues, 10);
      const min = 0;
      const axis = integerAxis(max);
      const range = Math.max(axis.max - min, 1);
      const x = index => pad.left + index * ((width - pad.left - pad.right) / (SITE_DATA.years.length - 1));
      const y = value => height - pad.bottom - ((value - min) / range) * (height - pad.top - pad.bottom);
      const grid = axis.ticks.map(value => {
        const yy = y(value);
        return `<line x1="${pad.left}" y1="${yy}" x2="${width - pad.right}" y2="${yy}" stroke="#e4e9f2" stroke-width="1"/>
          <text x="10" y="${yy + 4}" fill="#667085" font-size="12">${fmt.format(value)}</text>`;
      }).join("");
      const yearLabels = SITE_DATA.years.map((year, index) =>
        `<text x="${x(index)}" y="${height - 12}" text-anchor="middle" fill="#667085" font-size="12">${year}</text>`
      ).join("");
      const series = rows.map((row, rowIndex) => {
        const color = colors[rowIndex % colors.length];
        const points = row.values.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const markers = row.values.map((value, index) =>
          `<circle cx="${x(index)}" cy="${y(value)}" r="4" fill="${color}"><title>${escapeHtml(row.department)} ${SITE_DATA.years[index]}: ${fmt.format(value)}人</title></circle>`
        ).join("");
        return `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${markers}`;
      }).join("");
      const legend = rows.map((row, index) =>
        `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;"><span style="width:12px;height:12px;background:${colors[index % colors.length]};display:inline-block;border-radius:2px;"></span>${escapeHtml(row.department)}</span>`
      ).join("");
      return `<div class="chart-wrap">
        <div class="chart-note">
          <span><strong>單位：</strong>入學人數（人）</span>
          <span><strong>橫軸：</strong>學年度</span>
          <span><strong>115-116：</strong>趨勢推估值</span>

        <details class="formula-details">

        <svg class="line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${escapeHtml(group.title)}入學趨勢，單位為入學人數，橫軸為學年度">
          ${grid}
          <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height - pad.bottom}" stroke="#cfd7e6" stroke-width="1.2"/>
          <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#cfd7e6" stroke-width="1"/>
          ${yearLabels}
          ${series}
        </svg>
        <div style="padding:0 10px 8px;color:#475467;font-size:13px;">${legend}</div>
      </div>`;
    }

        <article class="source-card">
          <h4>${escapeHtml(profile.department)}</h4>
          <p class="source-summary">${escapeHtml(profile.summary)}</p>
          <div class="source-facts">
            <div class="source-fact"><span>114日間部四技</span><strong>${escapeHtml(profile.total114)}</strong></div>
            <div class="source-fact"><span>來源學校數</span><strong>${escapeHtml(profile.sourceSchoolCount114)}</strong></div>
          </div>
          <div class="source-block-title">114主要來源學校（114個人資料）</div>
          <div class="dist-list">${distributionRows(profile.topSchools114)}</div>
          <div class="source-block-title">戶籍縣市</div>
          <div class="dist-list">${distributionRows(profile.topHomeCities114.slice(0, 3))}</div>
          <div class="source-block-title">畢業學校地理區域</div>
          <div class="dist-list">${distributionRows(profile.topGraduationRegions114)}</div>
          <div class="source-block-title">入學管道</div>
          <div class="dist-list">${distributionRows(profile.topAdmissionChannels114.slice(0, 4))}</div>
          <div class="source-block-title">110-114累計主要來源學校（1-6統計）</div>
          <div class="dist-list">${distributionRows(profile.fiveYearTopSchools)}</div>
        </article>`).join("")}</div>`;
    }

    function infoRow(label, value) {
      if (!value) return "";
      return `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`;
    }

    function curriculumCards(group) {
      return `<div class="curriculum-grid">${group.curriculumRows.map(row => `
        <article class="dept-card">
          <h4>${escapeHtml(row.department)}</h4>
          <dl>
            ${infoRow("學分結構", row.credits)}
            ${infoRow("核心課程", row.core)}
            ${infoRow("特色方向", row.features)}
          </dl>
        </article>`).join("")}</div>`;
    }

    function renderGroup(group) {
      document.getElementById("app").innerHTML = `
        <header class="page-header">
          <div>
            <h2>${escapeHtml(group.title)}</h2>
            <p>${escapeHtml(group.subtitle)}</p>
          </div>
          <div class="feasibility ${group.feasibilityTone === "caution" ? "caution" : ""}">
            <span>整合可行性</span>
            <strong>${escapeHtml(group.feasibility)}</strong>
          </div>
        </header>

        ${kpis(group)}
        ${sourceNote("kpi")}

        ${dataExplorer(group)}

        <section class="section">
          <div class="section-head">
            <div>
              <h3>分析總覽</h3>
              <p>以定位、招生、課程、研究與建議方向快速檢視。</p>
            </div>
          </div>
          ${analysisGrid(group)}
          ${sourceNote("overview")}
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <h3>招生與入學趨勢</h3>
              <span class="unit-badge">單位：人</span>
              <p>110至114為原始資料實績，115至116為依110至114實績計算之趨勢推估；本區所有趨勢數值皆為入學人數。</p>
            </div>
          </div>
          ${lineChart(group)}
          <div style="height:14px"></div>
          ${enrollmentTable(group)}
          ${sourceNote("enrollment")}
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <h3>新生來源樣態</h3>
              <p>以114年日間部四技個人層級資料為主，並輔以110至114年日間部四技來源學校加總資料。</p>
            </div>
          </div>
          ${sourceProfiles(group)}
          ${sourceNote("source")}
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <h3>研究量能</h3>
              <span class="unit-badge">資料期間：2018-2025</span>
            </div>
          </div>
          ${researchTable(group)}
          ${sourceNote("research")}
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <h3>產學合作收入</h3>
              <p>以110至114年產學計畫總金額、專任教師數與每師平均產學收入檢視各系產學量能。</p>
            </div>
          </div>
          ${industryChart(group)}
          <div style="height:14px"></div>
          ${industryTable(group)}
          ${sourceNote("industry")}
        </section>

        <section class="section">
          <div class="section-head">
            <div>
              <h3>課程與專業差異</h3>
              <p>整理各系核心課程、學分結構與特色方向，供比較專業差異與共同課程空間。</p>
            </div>
          </div>
          ${curriculumCards(group)}
          ${sourceNote("curriculum")}
        </section>
      `;
      initDataExplorer(group);
    }

    function render() {
      const id = currentId();
      const group = SITE_DATA.groups.find(item => item.id === id);
      document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.toggle("active", button.dataset.id === id);
      });
      document.getElementById("groupSelect").value = id;
      renderGroup(group);
    }

    window.addEventListener("hashchange", render);
    initNavigation();
    initFloatingTooltips();
    render();
  </script>
</body>
</html>
